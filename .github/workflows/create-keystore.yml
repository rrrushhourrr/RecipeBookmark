name: 署名用の keystore を作る（手動・1回だけ）

# Actions タブから手動で 1 回だけ実行します。
# リリース署名用の keystore を作り、Secrets に貼る値をまとめて渡します。
# PC も Android Studio も要りません。
#
# ⚠️ このワークフローの成果物には秘密鍵が入ります。
#    public リポジトリでは誰でも成果物をダウンロードできてしまうため、
#    下の「確認」ステップで実行を止めます。先にリポジトリを private にしてください。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: 確認（public リポジトリでは実行しない）
        run: |
          set -euo pipefail

          if [ "${{ github.event.repository.private }}" != "true" ]; then
            echo "::error::このリポジトリは public です。秘密鍵が誰にでもダウンロードできてしまうため中止しました。"
            echo ""
            echo "Settings → General → いちばん下の Danger Zone → Change repository visibility"
            echo "で private にしてから、もう一度実行してください。"
            echo "（個人用のレシピアプリなので private で困ることはありません）"
            exit 1
          fi

      - name: keystore を作る
        run: |
          set -euo pipefail

          # パスワードはここで自動生成します。
          # 入力欄に打たせると実行履歴に残ってしまうので、そうしません。
          STORE_PASSWORD="$(openssl rand -base64 24 | tr -d '/+=' | head -c 28)"
          KEY_ALIAS="recipebookmark"

          # keytool の PKCS12 では store と key のパスワードは同じにします
          keytool -genkeypair \
            -keystore release.jks \
            -storetype PKCS12 \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 4096 \
            -validity 10950 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -dname "CN=RecipeBookmark, OU=Personal, O=RecipeBookmark, L=-, ST=-, C=JP" \
            2> /dev/null

          mkdir -p out
          base64 -w 0 release.jks > out/KEYSTORE_BASE64.txt
          cp release.jks out/release.jks

          # 値はログに出さず、ファイルにだけ書きます
          {
            echo "GitHub の Settings → Secrets and variables → Actions → New repository secret"
            echo "で、次の 4 つを登録してください（名前は大文字のまま、そのままコピー）。"
            echo ""
            echo "----------------------------------------------------------------"
            echo "1) 名前: KEYSTORE_BASE64"
            echo "   値  : 同じフォルダの KEYSTORE_BASE64.txt の中身を全部（改行なしの長い 1 行）"
            echo ""
            echo "2) 名前: KEYSTORE_PASSWORD"
            echo "   値  : $STORE_PASSWORD"
            echo ""
            echo "3) 名前: KEY_ALIAS"
            echo "   値  : $KEY_ALIAS"
            echo ""
            echo "4) 名前: KEY_PASSWORD"
            echo "   値  : $STORE_PASSWORD"
            echo "----------------------------------------------------------------"
            echo ""
            echo "■ この 4 つは必ず別の場所にも控えてください"
            echo "  パスワードマネージャ（1Password / Bitwarden など）に"
            echo "  release.jks を添付し、上のパスワードも一緒に保存するのが確実です。"
            echo "  失うと、以後アプリを上書き更新できなくなります"
            echo "  （＝新規インストールになり、保存したレシピが消えます）。"
            echo ""
            echo "■ 登録して控えたら、この成果物（artifact）は削除してください"
            echo "  Actions → この実行 → 右上の … → Delete artifact"
            echo ""
            echo "■ 確認用の指紋（SHA-256）"
          } > out/READ-ME-FIRST.txt

          keytool -list -v -keystore release.jks -storepass "$STORE_PASSWORD" \
            | grep -A1 "SHA256:" | head -2 >> out/READ-ME-FIRST.txt || true

      - name: 成果物として渡す
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore-SECRET-DELETE-AFTER-USE
          path: out/
          retention-days: 1
          if-no-files-found: error

      - name: 次にやること
        run: |
          {
            echo "## keystore を作りました"
            echo ""
            echo "1. このページを下にスクロールし、**Artifacts** の"
            echo "   **signing-keystore-SECRET-DELETE-AFTER-USE** をタップしてダウンロード（zip）"
            echo "2. 中の \`READ-ME-FIRST.txt\` を開き、書かれている 4 つの Secret を登録"
            echo "3. \`release.jks\` とパスワードをパスワードマネージャに控える"
            echo "4. 控えたら、この成果物を削除する（右上の … → Delete artifact）"
            echo "5. Actions → 「APK をビルド」→ Run workflow で署名済み APK ができます"
            echo ""
            echo "> パスワードは自動生成したので、ログにも実行履歴にも残っていません。"
            echo "> zip の中の READ-ME-FIRST.txt にだけ書いてあります。"
          } >> "$GITHUB_STEP_SUMMARY"
